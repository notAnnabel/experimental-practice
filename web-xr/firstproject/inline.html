<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script> <!--adds interaction-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <a-scene> <!--original AFRAME scene--> 
        <a-camera> 
            <a-entity cursor="rayOrigin: mouse" raycaster="objects: .interactive">  </a-entity> <!--vanilla container-->
        </a-camera>
      <a-box class="interactive" position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" event-set__down="_event: mousedown; material.color: #DB7093"></a-box> <!--if mouse down-->
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      <a-plane class="interactive" position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4" event-set__down="_event: mousedown; material.color: darkgreen"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
